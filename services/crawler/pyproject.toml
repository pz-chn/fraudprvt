[project]
name = "crawler"
version = "0.1.0"
description = "MyGoPen 文章 RSS 爬蟲"
authors = [
    { name = "pz-chn", email = "prz.chen@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "feedparser>=6.0.14",
    "loguru>=0.7.3",
    # pymysql 不會出現在任何 import, 是 sqlalchemy 連線字串 mysql+pymysql:// 在執行期載入的 driver
    "pymysql>=1.2.3",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]
